<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ff0ff"/>
      <stop offset="35%" stop-color="#35e0d8"/>
      <stop offset="70%" stop-color="#1c8f8a"/>
      <stop offset="100%" stop-color="#6ff0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#eafffb"/>
      <stop offset="45%" stop-color="#35e0d8"/>
      <stop offset="100%" stop-color="#04121f"/>
    </radialGradient>
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="7" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <rect width="1200" height="400" fill="url(#g)" opacity="0.75"/>
  <rect width="1200" height="400" filter="url(#n)" fill="#eafffb"/>
</svg>
